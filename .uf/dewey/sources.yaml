# Auto-generated by uf init. Customize as needed.
# This file is user-owned -- uf init will not
# overwrite it after initial creation.

sources:
  # Per-repo disk sources (fine-grained provenance)
  - id: disk-local
    type: disk
    name: opencode-reasoning-audit
    config:
      path: "."

  - id: disk-opencode-profiles
    type: disk
    name: opencode-profiles
    config:
      path: "../opencode-profiles"

  - id: disk-opencode-session-search
    type: disk
    name: opencode-session-search
    config:
      path: "../opencode-session-search"

  - id: disk-website
    type: disk
    name: website
    config:
      path: "../website"

  # Org-level files (design papers, plans)
  - id: disk-org
    type: disk
    name: org-workspace
    config:
      path: "../"
      recursive: false

  # GitHub API (issues, PRs, READMEs)
  - id: github-jflowers
    type: github
    name: jflowers org
    config:
      org: jflowers
      repos:
        - opencode-reasoning-audit
        - opencode-profiles
        - opencode-session-search
        - website
    refresh_interval: daily
